name: AOSP Proof of Concept

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clean runner
        shell: bash
        run: |
          set -eu
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean

          echo "Disk after cleanup:"
          df -h

      - name: Show runner resources
        shell: bash
        run: |
          set -eu
          echo "CPU:"
          nproc

          echo "Memory:"
          free -h

          echo "Disk:"
          df -h

          echo "Existing swap:"
          swapon --show || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -eu

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            unzip \
            zstd \
            rsync \
            bc \
            ccache \
            python3 \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            libxml2-utils \
            xsltproc \
            lz4

      - name: Install repo
        shell: bash
        run: |
          set -eu

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure additional swap
        shell: bash
        run: |
          set -eu

          echo "Existing swap:"
          swapon --show || true

          if [ ! -f /aosp-swapfile ]; then
            sudo fallocate -l 24G /aosp-swapfile
            sudo chmod 600 /aosp-swapfile
            sudo mkswap /aosp-swapfile
          fi

          sudo swapon -p 10 /aosp-swapfile || true

          sudo sysctl -w vm.swappiness=10

          echo "Memory:"
          free -h

          echo "Swap:"
          swapon --show

          echo "Disk:"
          df -h

      - name: Restore ccache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/ccache
          key: aosp-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            aosp-ccache-${{ runner.os }}-${{ github.ref_name }}-
            aosp-ccache-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -eu

          mkdir -p "$HOME/ccache"

          ccache -M 5G

          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/ccache" >> "$GITHUB_ENV"

          ccache -s

      - name: Initialize AOSP
        shell: bash
        run: |
          set -eu

          mkdir -p "$GITHUB_WORKSPACE/aosp"

          cd "$GITHUB_WORKSPACE/aosp"

          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android-latest-release \
            --partial-clone \
            --no-use-superproject

      - name: Sync AOSP
        working-directory: aosp
        shell: bash
        run: |
          set -eu

          repo sync \
            -c \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2

      - name: Check AOSP storage
        shell: bash
        run: |
          set -eu

          echo "Filesystem:"
          df -h

          echo "AOSP size:"
          du -sh "$GITHUB_WORKSPACE/aosp"

          echo "Memory:"
          free -h

          echo "Swap:"
          swapon --show

      - name: Build AOSP
        working-directory: aosp
        shell: bash
        run: |
          set -eu

          source build/envsetup.sh

          lunch aosp_cf_x86_64_phone-userdebug

          m -j2

      - name: Show build results
        if: always()
        shell: bash
        run: |
          echo "Filesystem:"
          df -h

          echo "Memory:"
          free -h

          echo "Swap:"
          swapon --show

          echo "ccache:"
          ccache -s || true

          echo "Android images:"
          find aosp/out/target/product \
            -type f \
            \( -name "*.img" -o -name "*.zip" \) \
            -exec ls -lh {} \; 2>/dev/null || true

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/ccache
          key: aosp-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Android images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aosp-proof-of-concept
          path: |
            aosp/out/target/product/**/*.img
            aosp/out/target/product/**/*.zip
          if-no-files-found: warn
          retention-days: 7
