name: AOSP Proof of Concept

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          echo "=== BEFORE CLEANUP ==="
          df -h
          df -i

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== AFTER CLEANUP ==="
          df -h
          df -i

      - name: Show runner resources
        shell: bash
        run: |
          set -eux

          echo "=== CPU ==="
          nproc

          echo "=== MEMORY ==="
          free -h

          echo "=== DISK ==="
          df -h

          echo "=== INODES ==="
          df -i

          echo "=== EXISTING SWAP ==="
          swapon --show || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            unzip \
            zstd \
            rsync \
            bc \
            ccache \
            python3 \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            libxml2-utils \
            xsltproc \
            lz4

      - name: Install repo
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Configure additional swap
        shell: bash
        run: |
          set -eux

          echo "=== EXISTING SWAP ==="
          swapon --show || true

          if [ ! -f /aosp-swapfile ]; then
            sudo fallocate -l 24G /aosp-swapfile
            sudo chmod 600 /aosp-swapfile
            sudo mkswap /aosp-swapfile
          fi

          sudo swapon -p 10 /aosp-swapfile || true

          sudo sysctl -w vm.swappiness=10

          echo "=== MEMORY ==="
          free -h

          echo "=== SWAP ==="
          swapon --show

          echo "=== DISK ==="
          df -h

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/ccache"

          ccache -M 5G

          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/ccache" >> "$GITHUB_ENV"

          ccache -s

      - name: Initialize AOSP
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/aosp"

          cd "$GITHUB_WORKSPACE/aosp"

          repo init \
            --partial-clone \
            --no-use-superproject \
            -b android-latest-release \
            -u https://android.googlesource.com/platform/manifest

      - name: Sync AOSP
        working-directory: aosp
        shell: bash
        run: |
          set -eux

          echo "=== AOSP SYNC ==="
          echo "Using 4 parallel jobs to reduce checkout pressure."

          repo sync \
            -c \
            -j4 \
            --force-sync \
            --fail-fast

      - name: Verify AOSP checkout
        working-directory: aosp
        shell: bash
        run: |
          set -eux

          echo "=== REPO STATUS ==="
          repo status

          echo "=== DISK ==="
          df -h

          echo "=== INODES ==="
          df -i

          echo "=== MEMORY ==="
          free -h

          echo "=== SWAP ==="
          swapon --show

          echo "=== AOSP SIZE ==="
          du -sh .

      - name: Build AOSP
        working-directory: aosp
        shell: bash
        run: |
          set -eux

          source build/envsetup.sh

          lunch aosp_cf_x86_64_phone-userdebug

          m -j2

      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== INODES ==="
          df -i

          echo "=== MEMORY ==="
          free -h

          echo "=== SWAP ==="
          swapon --show || true

          echo "=== CCACHE ==="
          ccache -s || true

          echo "=== AOSP SIZE ==="
          du -sh aosp 2>/dev/null || true

          echo "=== OUTPUT SIZE ==="
          du -sh aosp/out 2>/dev/null || true

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/ccache
          key: aosp-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Android images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aosp-proof-of-concept
          path: |
            aosp/out/target/product/**/*.img
            aosp/out/target/product/**/*.zip
          if-no-files-found: warn
          retention-days: 7
